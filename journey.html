<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>土耳其 · 行程动画</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --sea:#070E1A;
    --paper:#E9E2D5;
    --muted:rgba(233,226,213,.52);
    --faint:rgba(233,226,213,.18);
    --amber:#F2A93B;
    --turq:#4FA7BA;
    --serif:"Newsreader",Georgia,"Songti SC",serif;
    --sans:"Inter Tight","Hiragino Sans GB","PingFang SC",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--sea);color:var(--paper);font-family:var(--sans);
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  #app{position:fixed;inset:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  .hud{position:absolute;inset:0;pointer-events:none}
  .hud > *{pointer-events:auto}

  /* ---- masthead ---- */
  .mast{position:absolute;top:26px;left:30px;line-height:1}
  .mast h1{
    font-family:var(--serif);font-weight:300;font-size:26px;letter-spacing:.14em;
    color:var(--paper);
  }
  .mast p{margin-top:9px;font-size:11.5px;color:var(--muted);letter-spacing:.05em}

  /* ---- odometer ---- */
  .odo{position:absolute;top:26px;right:30px;text-align:right;line-height:1}
  .odo b{
    font-family:var(--serif);font-weight:300;font-size:34px;
    font-variant-numeric:tabular-nums;letter-spacing:-.01em;
  }
  .odo b span{font-size:14px;color:var(--muted);margin-left:5px;letter-spacing:.06em}
  .odo p{margin-top:8px;font-size:11.5px;color:var(--muted)}

  /* ---- day block ---- */
  .day{position:absolute;left:30px;bottom:112px;max-width:min(360px,52vw)}
  .day .row{display:flex;align-items:baseline;gap:13px}
  .day .n{
    font-family:var(--serif);font-weight:300;font-size:78px;line-height:.8;
    font-variant-numeric:tabular-nums;
  }
  .day .meta{padding-bottom:5px}
  .day .date{font-family:var(--serif);font-size:19px;font-weight:400}
  .day .dow{font-size:11.5px;color:var(--muted);margin-top:6px;letter-spacing:.12em}
  .day h2{
    margin-top:17px;font-family:var(--serif);font-weight:400;font-size:20px;
    line-height:1.42;letter-spacing:.015em;
  }
  .day .leg{
    margin-top:13px;font-size:12.5px;color:var(--muted);line-height:1.6;
    display:flex;gap:9px;align-items:baseline;min-height:20px;
  }
  .day .leg i{
    font-style:normal;color:var(--amber);font-size:11px;letter-spacing:.1em;
    white-space:nowrap;
  }

  /* ---- transport bar ---- */
  .bar{position:absolute;left:30px;right:30px;bottom:30px}
  .track{position:relative;height:34px;cursor:pointer}
  .track:focus-visible{outline:1px solid var(--amber);outline-offset:6px;border-radius:2px}
  .rule{position:absolute;left:0;right:0;top:17px;height:1px;background:var(--faint)}
  .fill{position:absolute;left:0;top:17px;height:1px;background:var(--paper);width:0}
  .head{
    position:absolute;top:17px;left:0;width:7px;height:7px;border-radius:50%;
    background:var(--amber);transform:translate(-50%,-50%);
    box-shadow:0 0 0 4px rgba(242,169,59,.18);
  }
  .ticks{position:absolute;left:0;right:0;top:0;height:34px}
  .tick{
    position:absolute;top:11px;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:9px;
  }
  .tick span{width:1px;height:8px;background:var(--faint)}
  .tick em{
    font-style:normal;font-size:10.5px;color:var(--muted);
    font-variant-numeric:tabular-nums;transition:color .3s
  }
  .tick.on em{color:var(--paper)}
  .tick.on span{background:var(--paper)}

  .ctrls{display:flex;align-items:center;gap:7px;margin-top:16px}
  button{
    font-family:var(--sans);font-size:11.5px;color:var(--muted);
    background:none;border:1px solid var(--faint);border-radius:100px;
    padding:7px 15px;cursor:pointer;transition:color .2s,border-color .2s;
    letter-spacing:.03em;
  }
  button:hover{color:var(--paper);border-color:rgba(233,226,213,.42)}
  button:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
  button.on{color:#0B1422;background:var(--paper);border-color:var(--paper)}
  .ctrls .hint{
    margin-left:16px;font-size:11px;color:rgba(233,226,213,.3);letter-spacing:.04em
  }
  .lang{
    margin-left:auto;display:flex;gap:2px;padding:2px;
    border:1px solid var(--faint);border-radius:100px;
  }
  .lang button{border:none;padding:6px 12px}
  .lang button.on{color:#0B1422;background:var(--paper)}

  body[data-lang="ja"]{--sans:"Inter Tight","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
  body[data-lang="en"]{--sans:"Inter Tight",system-ui,sans-serif}
  body[data-lang="ja"] .day h2,body[data-lang="ja"] .day .date{font-family:"Hiragino Mincho ProN","Yu Mincho",var(--serif)}

  .vignette{
    position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(to top,rgba(7,14,26,.92) 0%,rgba(7,14,26,.5) 20%,rgba(7,14,26,0) 42%),
      linear-gradient(to bottom,rgba(7,14,26,.6) 0%,rgba(7,14,26,0) 22%);
  }

  @media (max-width:720px){
    .mast{top:18px;left:18px}
    .mast h1{font-size:20px}
    .odo{top:18px;right:18px}
    .odo b{font-size:26px}
    .day{left:18px;bottom:148px;max-width:64vw}
    .day .n{font-size:54px}
    .day h2{font-size:16px;margin-top:12px}
    .day .leg{font-size:11.5px}
    .bar{left:18px;right:18px;bottom:20px}
    .ctrls{flex-wrap:wrap;gap:6px}
    .ctrls .hint{display:none}
    .lang{margin-left:auto}
    .lang button{padding:6px 10px;font-size:11px}
    button{padding:6px 12px}
  }
</style>
</head>
<body>
<script>
/* 与手册首页共用同一把锁：未解锁时回到 index.html 输入密码 */
(function(){
  if(window.top !== window.self) return;   // 嵌在手册里时，由首页负责解锁
  var KEY='tth-unlock', HASH='7c43f0ef81909dd38565723a8ab8063fd48673b1a4d5cff18e59c6528c82d93a', ok=false;
  try{ ok = sessionStorage.getItem(KEY) === HASH; }catch(e){}
  if(!ok){
    try{
      var o = JSON.parse(localStorage.getItem(KEY) || 'null');
      ok = !!(o && o.h === HASH && typeof o.exp === 'number' && o.exp > Date.now());
    }catch(e){}
  }
  if(!ok) location.replace('index.html');
})();
</script>
<div id="app">
  <canvas id="map"></canvas>
  <div class="vignette"></div>
  <div class="hud">
    <div class="mast">
      <h1 id="mastTitle">土耳其</h1>
      <p id="scene">2026.9.17 — 9.24 · 8天7夜</p>
    </div>

    <div class="odo">
      <b id="km">0</b><b><span>km</span></b>
      <p id="odolabel">累计移动</p>
    </div>

    <div class="day">
      <div class="row">
        <div class="n" id="dnum">0</div>
        <div class="meta">
          <div class="date" id="ddate">9月17日</div>
          <div class="dow" id="ddow">木</div>
        </div>
      </div>
      <h2 id="dtitle">出发与夜间转机</h2>
      <div class="leg"><i id="lmode"></i><span id="ltext"></span></div>
    </div>

    <div class="bar">
      <div class="track" id="track" tabindex="0" role="slider" aria-label="行程进度" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0">
        <div class="rule"></div>
        <div class="fill" id="fill"></div>
        <div class="ticks" id="ticks"></div>
        <div class="head" id="head"></div>
      </div>
      <div class="ctrls">
        <button id="play">暂停</button>
        <button id="restart">重播</button>
        <button class="sp" data-s="1">1×</button>
        <button class="sp on" data-s="1.6">1.6×</button>
        <button class="sp" data-s="2.6">2.6×</button>
        <span class="lang" id="lang">
          <button data-l="zh" class="on" lang="zh">中</button>
          <button data-l="ja" lang="ja">日</button>
          <button data-l="en" lang="en">EN</button>
        </span>
        <span class="hint" id="hint">空格 播放 / 暂停 · ← → 快退快进</span>
      </div>
    </div>
  </div>
</div>

/* ============================================================
   投影 / 几何
   ============================================================ */
const RAD = Math.PI/180;
function proj(lat,lon){
  const x=(lon+180)/360;
  let s=Math.sin(lat*RAD); s=Math.max(-0.9999,Math.min(0.9999,s));
  return [x, 0.5-Math.log((1+s)/(1-s))/(4*Math.PI)];
}
function haversine(a,b){
  const R=6371, dLat=(b[0]-a[0])*RAD, dLon=(b[1]-a[1])*RAD;
  const h=Math.sin(dLat/2)**2+Math.cos(a[0]*RAD)*Math.cos(b[0]*RAD)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function arcPath(p0,p1,k){
  const mx=(p0[0]+p1[0])/2, my=(p0[1]+p1[1])/2;
  const dx=p1[0]-p0[0], dy=p1[1]-p0[1];
  const cx=mx-dy*k, cy=my+dx*k, out=[];
  for(let i=0;i<=140;i++){
    const t=i/140,u=1-t;
    out.push([u*u*p0[0]+2*u*t*cx+t*t*p1[0], u*u*p0[1]+2*u*t*cy+t*t*p1[1]]);
  }
  return {out,marks:[0,out.length-1]};
}
function spline(p,seg){
  if(p.length<2) return {out:p.slice(),marks:[0]};
  const q=[p[0]].concat(p,[p[p.length-1]]);
  const out=[],marks=[];
  for(let i=1;i<q.length-2;i++){
    marks.push(out.length);
    const a=q[i-1],b=q[i],c=q[i+1],d=q[i+2];
    for(let j=0;j<seg;j++){
      const t=j/seg,t2=t*t,t3=t2*t;
      out.push([
        .5*(2*b[0]+(-a[0]+c[0])*t+(2*a[0]-5*b[0]+4*c[0]-d[0])*t2+(-a[0]+3*b[0]-3*c[0]+d[0])*t3),
        .5*(2*b[1]+(-a[1]+c[1])*t+(2*a[1]-5*b[1]+4*c[1]-d[1])*t2+(-a[1]+3*b[1]-3*c[1]+d[1])*t3)
      ]);
    }
  }
  out.push([q[q.length-2][0],q[q.length-2][1]]);
  marks.push(out.length-1);
  return {out,marks};
}

/* ---- 预处理航段 ---- */
const PAUSE=.28, DAYPAUSE=1.0;
let T0=0, TOTAL=0, TOTALKM=0;
const POIS=[];

LEGS.forEach((L,i)=>{
  const coords=L.pts.map(p=>P[p[0]]);
  const world=coords.map(c=>proj(c[0],c[1]));
  const r = L.curve==="arc" ? arcPath(world[0],world[1],L.arc) : spline(world,16);
  L.path=r.out;

  const cum=[0];
  for(let k=1;k<r.out.length;k++){
    cum.push(cum[k-1]+Math.hypot(r.out[k][0]-r.out[k-1][0], r.out[k][1]-r.out[k-1][1]));
  }
  L.cum=cum; L.len=cum[cum.length-1]||1e-9;
  L.wp=r.marks.map(m=>cum[Math.min(m,cum.length-1)]/L.len);

  let km=0;
  for(let k=1;k<coords.length;k++) km+=haversine(coords[k-1],coords[k]);
  L.km=km; L.km0=TOTALKM; TOTALKM+=km;

  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const pt of r.out){x0=Math.min(x0,pt[0]);y0=Math.min(y0,pt[1]);x1=Math.max(x1,pt[0]);y1=Math.max(y1,pt[1]);}
  L.bb=[x0,y0,x1,y1];

  const prev=LEGS[i-1];
  const gap = i===0 ? 0 : (prev.d!==L.d ? DAYPAUSE : PAUSE);
  L.t0 = (i===0 ? 0 : prev.t1 + gap);
  L.t1 = L.t0 + L.dur;
  TOTAL = L.t1;

  L.pts.forEach((p,j)=>{
    if(!p[1]) return;
    POIS.push({
      key:p[0], label:p[1], w:world[Math.min(j,world.length-1)],
      t:L.t0 + L.dur*(L.wp[Math.min(j,L.wp.length-1)]||0),
      zmax:L.span*3.2, leg:i
    });
  });
});
TOTAL += 2.4; // 结尾留白

const DAYT = DAYS.map(d=>{
  const ls=LEGS.filter(l=>l.d===d.n);
  return {...d, t0:ls[0].t0, t1:ls[ls.length-1].t1};
});

let W=0,H=0,DPR=1;
function resize(){

  W=cv.clientWidth; H=cv.clientHeight;

const cam={x:0,y:0,span:78};
const SC=()=>W*360/cam.span;
const sx=x=>(x-cam.x)*SC()+W/2;
const sy=y=>(y-cam.y)*SC()+H/2;
/* 米 → 世界单位（墨卡托近似）*/
const m2w=(m,lat)=>m/(40075017*Math.cos(lat*RAD));

function ringsPath(rings){
  ctx.beginPath();
  for(const r of rings){
    for(let i=0;i<r.length;i+=2){
      const p=proj(r[i+1],r[i]);
      const X=sx(p[0]), Y=sy(p[1]);
      if(i===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y);
    }
    ctx.closePath();
  }
}
function polyPath(pts){
  ctx.beginPath();
  pts.forEach((c,i)=>{
    const p=proj(c[1],c[0]);
    const X=sx(p[0]), Y=sy(p[1]);
    if(i===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y);
  });
  ctx.closePath();
}
const fade=(v,a,b)=>Math.max(0,Math.min(1,(v-a)/(b-a)));

function drawLand(){
  const s=cam.span;
  const aWorld = fade(s,12,26);                         // 洲际
  const aTurkey= fade(s,.18,.42)*(1-fade(s,14,26));     // 土耳其
  const aIst   = fade(s,.06,.12)*(1-fade(s,1.6,2.6));   // 伊斯坦布尔 10m
  const aCore  = 1-fade(s,.18,.34);                     // 老城手绘岸线
  const nearIst = cam.x>proj(41,28.3)[0] && cam.x<proj(41,29.9)[0] && cam.y>proj(41.7,0)[1] && cam.y<proj(40.5,0)[1];
  const nearCap = cam.x>proj(38,34.4)[0] && cam.x<proj(38,35.1)[0] && cam.y>proj(39.0,0)[1] && cam.y<proj(38.3,0)[1];
  const aCap = (1-fade(s,.25,.60))*(nearCap?1:0);

  if(aWorld>.01){
    ctx.save(); ctx.globalAlpha=aWorld;
    ringsPath(GEO.world);
    ctx.fillStyle="#152232"; ctx.fill("evenodd");
    ctx.restore();
  }
  if(aTurkey>.01){
    ctx.save(); ctx.globalAlpha=aTurkey;
    ringsPath(GEO.turkey);
    ctx.fillStyle="#16263A"; ctx.fill("evenodd");
    ctx.lineWidth=.8; ctx.strokeStyle="rgba(72,120,160,.30)"; ctx.stroke();
    ctx.restore();
  }
  if(nearIst && aIst>.01){
    ctx.save(); ctx.globalAlpha=aIst;
    ringsPath(GEO.ist);
    ctx.fillStyle="#16263A"; ctx.fill("evenodd");
    ctx.lineWidth=1; ctx.strokeStyle="rgba(72,120,160,.38)"; ctx.stroke();
    ctx.restore();
  }
  if(nearIst && aCore>.01){
    ctx.save(); ctx.globalAlpha=aCore;
    [EUROPE_CORE,ASIA_CORE].forEach(poly=>{
      polyPath(poly);
      ctx.fillStyle="#17283D"; ctx.fill();
      ctx.lineWidth=1.1; ctx.strokeStyle="rgba(79,167,186,.34)"; ctx.stroke();
    });
    ctx.restore();
  }
  if(aCap>.01){
    ctx.save(); ctx.globalAlpha=aCap;
    ctx.fillStyle="#17283D"; ctx.fillRect(0,0,W,H);
    const k=SC();
    VALLEYS.forEach(v=>{
      ctx.beginPath();
      v.p.forEach((c,i)=>{const p=proj(c[1],c[0]);i?ctx.lineTo(sx(p[0]),sy(p[1])):ctx.moveTo(sx(p[0]),sy(p[1]));});
      ctx.lineCap="round"; ctx.lineJoin="round";
      ctx.lineWidth=Math.max(3,m2w(v.w,38.65)*k); ctx.strokeStyle="#101D2C"; ctx.stroke();
      ctx.lineWidth=Math.max(1,m2w(v.w*.34,38.65)*k); ctx.strokeStyle="rgba(79,167,186,.16)"; ctx.stroke();
    });
    ctx.setLineDash([5,7]); ctx.lineWidth=1; ctx.strokeStyle="rgba(233,226,213,.13)";
    ROADS.forEach(r=>{
      ctx.beginPath();
      r.forEach((c,i)=>{const p=proj(c[1],c[0]);i?ctx.lineTo(sx(p[0]),sy(p[1])):ctx.moveTo(sx(p[0]),sy(p[1]));});
      ctx.stroke();
    });
    ctx.setLineDash([]);
    ctx.restore();
  }
}

/* 海面经纬网 */
function drawGrid(){
  const al=.055*fade(cam.span,4,14);
  if(al<.006) return;
  const step = cam.span>40 ? 15 : 5;
  ctx.save(); ctx.globalAlpha=al; ctx.strokeStyle="#4FA7BA"; ctx.lineWidth=.6;
  const lon0=Math.floor((cam.x*360-180-cam.span/2)/step)*step;
  for(let lon=lon0;lon<cam.x*360-180+cam.span/2+step;lon+=step){
    const X=sx(proj(0,lon)[0]);
    ctx.beginPath(); ctx.moveTo(X,0); ctx.lineTo(X,H); ctx.stroke();
  }
  const latC=(Math.atan(Math.sinh((0.5-cam.y)*2*Math.PI))/RAD);
  const latSpan=cam.span*H/W;
  const lat0=Math.floor((latC-latSpan)/step)*step;
  for(let lat=lat0;lat<latC+latSpan+step;lat+=step){
    if(lat<-85||lat>85) continue;
    const Y=sy(proj(lat,0)[1]);
    ctx.beginPath(); ctx.moveTo(0,Y); ctx.lineTo(W,Y); ctx.stroke();
  }
  ctx.restore();
}

/* ---- 路线 ---- */
function strokeLeg(L,upto){
  const n=L.path.length;
  const end = upto===undefined ? n-1 : upto;
  ctx.beginPath();
  for(let i=0;i<=end;i++){
    const X=sx(L.path[i][0]), Y=sy(L.path[i][1]);
    i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);
  }
}
function visible(bb){
  const pad=200/SC();
  const x0=cam.x-(W/2)/SC()-pad, x1=cam.x+(W/2)/SC()+pad;
  const y0=cam.y-(H/2)/SC()-pad, y1=cam.y+(H/2)/SC()+pad;
  return !(bb[2]<x0||bb[0]>x1||bb[3]<y0||bb[1]>y1);
}
function drawRoutes(T){
  for(const L of LEGS){
    if(T<L.t0) continue;
    if(L.span>cam.span*8) continue;
    if(!visible(L.bb)) continue;
    const done = T>=L.t1;
    const raw = done?1:(T-L.t0)/L.dur;
    const pr = raw<.5 ? 4*raw*raw*raw : 1-Math.pow(-2*raw+2,3)/2;
    const cut = Math.max(1,Math.round(pr*(L.path.length-1)));
    ctx.lineCap="round"; ctx.lineJoin="round";
    strokeLeg(L,cut);
    if(L.mode==="ferry"){ctx.setLineDash([2,5]);}
    else if(L.mode==="balloon"){ctx.setLineDash([1,6]);}
    else ctx.setLineDash([]);
    ctx.lineWidth=done?1.3:2.1;
    ctx.strokeStyle=done?"rgba(233,226,213,.34)":(L.mode==="ferry"?"rgba(79,167,186,.9)":"rgba(233,226,213,.9)");
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

/* ---- 交通工具 ---- */
function icon(mode,g){
  g.beginPath();
  if(mode==="plane"){
    g.moveTo(11,0);g.lineTo(-1,4.4);g.lineTo(-9,5.8);g.lineTo(-7.6,2.0);
    g.lineTo(-3.2,1.2);g.lineTo(-6.4,0);g.lineTo(-3.2,-1.2);g.lineTo(-7.6,-2.0);
    g.lineTo(-9,-5.8);g.lineTo(-1,-4.4);g.closePath();
  } else if(mode==="bus"||mode==="car"){
    const w=mode==="bus"?9:7.5,h=4.2,r=1.6;
    g.moveTo(-w+r,-h);g.lineTo(w-r,-h);g.quadraticCurveTo(w,-h,w,-h+r);
    g.lineTo(w,h-r);g.quadraticCurveTo(w,h,w-r,h);g.lineTo(-w+r,h);
    g.quadraticCurveTo(-w,h,-w,h-r);g.lineTo(-w,-h+r);g.quadraticCurveTo(-w,-h,-w+r,-h);
    g.closePath();
  } else if(mode==="ferry"){
    g.moveTo(-8,-1);g.lineTo(8,-1);g.lineTo(5.5,4);g.lineTo(-7,4);g.closePath();
    g.moveTo(-4,-1);g.lineTo(-4,-5);g.lineTo(2,-5);g.lineTo(2,-1);g.closePath();
  } else if(mode==="atv"){
    g.moveTo(-6,-1);g.lineTo(6,-1);g.lineTo(4,2.5);g.lineTo(-4,2.5);g.closePath();
    g.moveTo(-2.0,3.4);g.arc(-4.4,3.4,2.4,0,6.284);
    g.moveTo(6.8,3.4);g.arc(4.4,3.4,2.4,0,6.284);
  } else if(mode==="balloon"){
    g.arc(0,-10,7.6,Math.PI*.86,Math.PI*.14);
    g.lineTo(2.4,-1.4);g.lineTo(-2.4,-1.4);g.closePath();
    g.moveTo(-2.6,1.2);g.lineTo(2.6,1.2);g.lineTo(2.1,4.2);g.lineTo(-2.1,4.2);g.closePath();
  } else { /* walk / hike */
    g.arc(0,0,3.4,0,6.284);
  }
}
function drawMarker(mode,X,Y,ang,T){
  const rot = (mode==="plane"||mode==="bus"||mode==="car"||mode==="ferry"||mode==="atv");
  ctx.save();
  ctx.translate(X,Y);
  if(mode==="balloon") ctx.translate(0,Math.sin(T*1.6)*2.2);
  if(rot) ctx.rotate(ang);
  ctx.shadowColor="rgba(242,169,59,.85)"; ctx.shadowBlur=18;
  ctx.fillStyle="#F2A93B"; icon(mode,ctx); ctx.fill();
  ctx.shadowBlur=0;
  if(mode==="walk"||mode==="hike"){
    const k=(T*1.1)%1;
    ctx.beginPath(); ctx.arc(0,0,3.4+k*13,0,6.284);
    ctx.strokeStyle=`rgba(242,169,59,${.5*(1-k)})`; ctx.lineWidth=1.4; ctx.stroke();
  }
  if(mode==="balloon"){
    ctx.strokeStyle="rgba(242,169,59,.55)"; ctx.lineWidth=.9;
    ctx.beginPath(); ctx.moveTo(-4.4,-2.6); ctx.lineTo(-2.1,1.2);
    ctx.moveTo(4.4,-2.6); ctx.lineTo(2.1,1.2); ctx.stroke();
  }
  ctx.restore();
}

function drawPois(T){
  const placed=[];
  for(const q of POIS){
    if(T<q.t) continue;
    if(cam.span>q.zmax) continue;
    const X=sx(q.w[0]), Y=sy(q.w[1]);
    if(X<-60||X>W+60||Y<-40||Y>H+40) continue;
    const age=T-q.t;
    const a=Math.min(1,age/.55);
    const fresh=Math.max(0,1-age/2.4);

    ctx.save(); ctx.globalAlpha=a;
    ctx.beginPath(); ctx.arc(X,Y,2.6,0,6.284);
    ctx.fillStyle="#E9E2D5"; ctx.fill();
    if(fresh>0){
      ctx.beginPath(); ctx.arc(X,Y,2.6+(1-fresh)*9,0,6.284);
      ctx.strokeStyle=`rgba(242,169,59,${.65*fresh})`; ctx.lineWidth=1.2; ctx.stroke();
    }
    ctx.font=labelFont(13,400);
    const lab=t(q.label);
    const w=ctx.measureText(lab).width;
    let lx=X+10, ly=Y+4.5, align="left";
    for(let tries=0;tries<4;tries++){
      const clash=placed.some(p=>Math.abs(p.y-ly)<15 && lx<p.x1+8 && lx+w>p.x0-8);
      const off=(align==="left"? lx+w>W-24 : lx-w<24);
      if(!clash&&!off) break;
      if(tries===0){ ly=Y-9; }
      else if(tries===1){ align="right"; lx=X-10; ly=Y+4.5; }
      else if(tries===2){ ly=Y-9; }
      else { ly=Y+18; align="left"; lx=X+10; }
    }
    ctx.textAlign=align;
    ctx.fillStyle=`rgba(233,226,213,${.55+.45*fresh})`;
    ctx.shadowColor="rgba(7,14,26,.9)"; ctx.shadowBlur=7;
    ctx.fillText(lab,lx,ly);
    ctx.restore();
    placed.push({y:ly, x0:align==="left"?lx:lx-w, x1:align==="left"?lx+w:lx});
  }
}

/* ============================================================
   时间轴 / 循环
   ============================================================ */
let T=0, playing=true, speed=1.6, last=performance.now(), snap=true;
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if(reduce) playing=false;

function activeLeg(t){
  let cur=LEGS[0], idx=0;
  for(let i=0;i<LEGS.length;i++){
    if(t>=LEGS[i].t0){cur=LEGS[i];idx=i;}
  }
  return {L:cur,i:idx};
}
function markerAt(L,t){
  const pr=Math.max(0,Math.min(1,(t-L.t0)/L.dur));
  const e = pr<.5 ? 4*pr*pr*pr : 1-Math.pow(-2*pr+2,3)/2;
  const d=e*L.len;
  let lo=0,hi=L.cum.length-1;
  while(lo<hi-1){const mid=(lo+hi)>>1; (L.cum[mid]<=d)?lo=mid:hi=mid;}
  const p0=L.path[lo],p1=L.path[Math.min(lo+1,L.path.length-1)];
  const seg=(L.cum[hi]-L.cum[lo])||1e-9, f=(d-L.cum[lo])/seg;
  return {
    x:p0[0]+(p1[0]-p0[0])*f, y:p0[1]+(p1[1]-p0[1])*f,
    ang:Math.atan2(p1[1]-p0[1],p1[0]-p0[0]), pr:e
  };
}

function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(playing){
    T+=dt*speed;
    if(T>=TOTAL){T=TOTAL;playing=false;syncPlay();}
  }
  const {L}=activeLeg(T);
  const m=markerAt(L,T);

  const k = snap?1:(1-Math.exp(-dt*3.4));
  cam.x+=(m.x-cam.x)*k;
  cam.y+=(m.y-cam.y)*k;
  cam.span=Math.exp(Math.log(cam.span)+(Math.log(L.span)-Math.log(cam.span))*(snap?1:(1-Math.exp(-dt*2.2))));
  snap=false;

  ctx.fillStyle="#070E1A"; ctx.fillRect(0,0,W,H);
  drawGrid();
  drawLand();
  drawRoutes(T);
  drawAnchors(T);
  drawPois(T);
  drawMarker(L.mode, sx(m.x), sy(m.y), m.ang, T);

  hud(L,m,T);
  requestAnimationFrame(frame);
}

/* ---- HUD ---- */
const $=id=>document.getElementById(id);
let kmShown=0;
function hud(L,m,T){
  const dd=DAYT.filter(x=>T>=x.t0-.55).pop()||DAYT[0];
  const d=DAYS[dd.n];
  $("dnum").textContent=d.n;
  $("ddate").textContent=t(d.date);
  $("ddow").textContent=t(d.dow);
  $("dtitle").textContent=t(d.title);

  const names=L.pts.map(p=>t(p[1]||"")).filter(Boolean);
  const from=L.pts[0][0], to=L.pts[L.pts.length-1][0];
  $("lmode").textContent=t(MODE[L.mode]);
  $("ltext").textContent = names.length>1
    ? names[names.length-1]
    : (names[0]||`${from} → ${to}`);

  const km=L.km0+L.km*m.pr;
  kmShown+=(km-kmShown)*.12;
  $("km").textContent=Math.round(kmShown).toLocaleString("en-US");

  $("scene").textContent = t(cam.span<.6
    ? (cam.x<proj(0,32)[0] ? "İstanbul · 伊斯坦布尔" : "Kapadokya · 卡帕多奇亚")
    : "2026.9.17 — 9.24 · 8天7夜");

  const p=T/TOTAL;
  $("fill").style.width=(p*100)+"%";
  $("head").style.left=(p*100)+"%";
  $("track").setAttribute("aria-valuenow",d.n);
  document.querySelectorAll(".tick").forEach((el,i)=>el.classList.toggle("on",i===d.n));
  return d;
}

/* ---- 刻度 ---- */
const ticks=$("ticks");
DAYT.forEach(d=>{
  const el=document.createElement("div");
  el.className="tick";
  el.style.left=(d.t0/TOTAL*100)+"%";
  el.innerHTML=`<span></span><em>${d.n}</em>`;
  ticks.appendChild(el);
});

/* ---- 控制 ---- */
function syncPlay(){ $("play").textContent = t(playing?"暂停":(T>=TOTAL?"重播":"播放")); }
$("play").onclick=()=>{
  if(T>=TOTAL){T=0;snap=true;kmShown=0;}
  playing=!playing; syncPlay();
};
$("restart").onclick=()=>{T=0;kmShown=0;snap=true;playing=true;syncPlay();};
document.querySelectorAll(".sp").forEach(b=>{
  b.onclick=()=>{
    speed=parseFloat(b.dataset.s);
    document.querySelectorAll(".sp").forEach(x=>x.classList.toggle("on",x===b));
  };
});
function seek(e){
  const r=$("track").getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX);
  T=Math.max(0,Math.min(TOTAL,(cx-r.left)/r.width*TOTAL));
  snap=true; kmShown=LEGS.find(l=>T<=l.t1)?.km0 ?? TOTALKM;
  syncPlay();
}
$("track").addEventListener("pointerdown",e=>{seek(e);
  const mv=ev=>seek(ev);
  const up=()=>{window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);};
  window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);
});
window.addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault();$("play").click();}
  if(e.code==="ArrowRight"){T=Math.min(TOTAL,T+3);snap=true;}
  if(e.code==="ArrowLeft"){T=Math.max(0,T-3);snap=true;}
  if(e.key==="r"||e.key==="R"){$("restart").click();}
});

/* ---- 语言 ---- */
function applyLang(){
  document.documentElement.lang = LANG==="zh"?"zh":LANG;
  document.body.dataset.lang = LANG;
  document.title = t("土耳其 · 行程动画");
  $("mastTitle").textContent = t("土耳其");
  $("odolabel").textContent = t("累计移动");
  $("restart").textContent = t("重播");
  $("hint").textContent = t("空格 播放 / 暂停 · ← → 快退快进");
  $("track").setAttribute("aria-label", t("行程进度"));
  syncPlay();
}
document.querySelectorAll("#lang button").forEach(b=>{
  b.onclick=()=>{
    LANG=b.dataset.l;
    document.querySelectorAll("#lang button").forEach(x=>x.classList.toggle("on",x===b));
    applyLang();
  };
});

/* ---- 接受父页面（手册）的语言切换 ---- */
window.addEventListener("message",e=>{
  const d = e && e.data;
  if(!d || d.type !== "tth-lang") return;
  const l = (d.lang === "en") ? "en" : (d.lang === "ja" ? "ja" : "zh");
  if(l === LANG) return;
  const b = document.querySelector('#lang button[data-l="'+l+'"]');
  if(b) b.click();
});

/* ---- 启动 ---- */
resize();
const p0=LEGS[0].path[0];
cam.x=p0[0]; cam.y=p0[1]; cam.span=LEGS[0].span;
applyLang();
requestAnimationFrame(t=>{last=t;frame(t);});
</script>
</body>
</html>
